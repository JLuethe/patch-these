name: Check source links

on:
  schedule:
    - cron: "0 17 * * 1" # Mondays at 17:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check source URLs and Markdown links
        run: python scripts/check_links.py --report _reports/link-check.json

      - name: Preserve the report, including inconclusive responses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-link-report
          path: _reports/link-check.json
          if-no-files-found: warn
          retention-days: 30
