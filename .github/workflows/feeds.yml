# Refresh the discovery cache. This is not an edition and it does not deploy the site.
# The cache lives on the feed-cache branch, one force-pushed commit with
# latest.json, kev-new.json, kev-seen.json and status.json at its root.
# Nothing is committed to main.

name: Discovery feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discovery-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore the cache from the feed-cache branch
        run: |
          mkdir -p "$RUNNER_TEMP/feed-cache"
          if git fetch --depth=1 origin feed-cache; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/feed-cache"
            git rev-parse 'FETCH_HEAD^{tree}' > "$RUNNER_TEMP/previous-tree"
          else
            echo "::notice::No feed-cache branch yet; starting a new cache."
          fi

      - name: Fetch public discovery feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_feeds.py --output "$RUNNER_TEMP/feed-cache"

      - name: Publish the cache to the feed-cache branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/feed-cache.index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$RUNNER_TEMP/feed-cache" add -A .
          tree=$(git write-tree)
          if [ -f "$RUNNER_TEMP/previous-tree" ] && [ "$tree" = "$(cat "$RUNNER_TEMP/previous-tree")" ]; then
            echo "Feed cache unchanged."
            exit 0
          fi
          commit=$(git commit-tree "$tree" -m "Discovery feed cache $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push --force origin "$commit:refs/heads/feed-cache"
