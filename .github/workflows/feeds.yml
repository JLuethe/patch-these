# Refresh the discovery cache. This is not an edition and it does not deploy the site.
# The cache lives on the feed-cache branch, one force-pushed commit with
# latest.json, kev-new.json, kev-seen.json, status.json, wake.json and
# woken.json at its root. Nothing is committed to main.
#
# Wakes: when wake.json has rows (a new CISA KEV entry, or a new advisory for a
# product covered in the last 7 days), the last step POSTs a short JSON body to
# the routine's webhook. It needs two repository secrets:
#   PATCH_THESE_WAKE_URL     the webhook URL
#   PATCH_THESE_WAKE_SECRET  sent as "Authorization: Bearer <secret>"
# Without both, the step logs a notice and skips. A row wakes the routine once.

name: Discovery feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discovery-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore the cache from the feed-cache branch
        run: |
          mkdir -p "$RUNNER_TEMP/feed-cache"
          if git fetch --depth=1 origin feed-cache; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/feed-cache"
            git rev-parse 'FETCH_HEAD^{tree}' > "$RUNNER_TEMP/previous-tree"
          else
            echo "::notice::No feed-cache branch yet; starting a new cache."
          fi

      - name: Fetch public discovery feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_feeds.py --output "$RUNNER_TEMP/feed-cache" --wake-body "$RUNNER_TEMP/wake-body.json"

      - name: Publish the cache to the feed-cache branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/feed-cache.index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$RUNNER_TEMP/feed-cache" add -A .
          tree=$(git write-tree)
          if [ -f "$RUNNER_TEMP/previous-tree" ] && [ "$tree" = "$(cat "$RUNNER_TEMP/previous-tree")" ]; then
            echo "Feed cache unchanged."
            exit 0
          fi
          commit=$(git commit-tree "$tree" -m "Discovery feed cache $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push --force origin "$commit:refs/heads/feed-cache"

      - name: Wake the editorial routine for new KEV entries or covered-vendor advisories
        env:
          WAKE_URL: ${{ secrets.PATCH_THESE_WAKE_URL }}
          WAKE_SECRET: ${{ secrets.PATCH_THESE_WAKE_SECRET }}
        run: |
          body="$RUNNER_TEMP/wake-body.json"
          if [ ! -s "$body" ]; then
            echo "No wake rows this run."
            exit 0
          fi
          echo "Wake rows: $(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["total"])' "$body")"
          if [ -z "$WAKE_URL" ] || [ -z "$WAKE_SECRET" ]; then
            echo "::notice title=Wake skipped::PATCH_THESE_WAKE_URL or PATCH_THESE_WAKE_SECRET is not set; the rows stay in wake.json on feed-cache."
            exit 0
          fi
          printf 'header = "Authorization: Bearer %s"\n' "$WAKE_SECRET" > "$RUNNER_TEMP/wake-curl.conf"
          if curl -fsS --max-time 20 --retry 2 -X POST -H "Content-Type: application/json" \
              -K "$RUNNER_TEMP/wake-curl.conf" --data-binary "@$body" "$WAKE_URL" -o /dev/null; then
            echo "Woke the editorial routine."
          else
            echo "::warning title=Wake failed::The wake POST failed; the rows stay in wake.json for the next scheduled run."
          fi
          rm -f "$RUNNER_TEMP/wake-curl.conf"
